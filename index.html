<!DOCTYPE html>
<html lang="es">

</head>
<body>

  <!-- Botón de menú (abre el overlay a pantalla completa) -->

    <a href="#" class="logo">Tu Nombre</a>
    <button class="menu-btn" aria-label="Abrir menú">menu</button>
  </header>

  <!-- Menú overlay, oculto al inicio -->
  <nav class="menu-overlay" id="menu-overlay">
    <button class="close-btn" aria-label="Cerrar menú">close</button>
    <ul class="menu-links">
      <li><a href="#trabajos">trabajos</a></li>
      <li><a href="#about">sobre mí</a></li>
      <li><a href="#contacto">contacto</a></li>
    </ul>
  </nav>

  <!-- Sección principal / hero -->
  <main>
    <section class="hero">
      <h1>Diseñador gráfico &amp; motion designer</h1>
      <p class="hero-sub">Basado en [tu ciudad]</p>
    </section>

    <!-- Lista de proyectos -->
    <section id="trabajos" class="projects">
      <!-- aquí irán tus proyectos, uno por uno -->
    </section>
  </main>

  <script src="sketch.js"></script>

</html>
